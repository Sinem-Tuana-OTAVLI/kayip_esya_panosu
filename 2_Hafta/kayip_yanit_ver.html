<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yanıt Ver - Kayıp Eşya Panosu</title>
    <link rel="stylesheet" href="css/stil.css">
</head>
<body>
    <header>
        <img src="image/au-logo.png" alt="Ankara Üniversitesi logosu" width="64">
        <h1>Kampüs Kayıp Eşya Panosu</h1>
        <nav>
            <ul>
                <li><a href="index.html">Ana Sayfa</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Yanıt Ver</h2>
        <p>Kayıp ilanındaki eşyayı buldunuz mu? Nereye teslim ettiğinizi ilan sahibine bildirin.</p>
        <form id="yanitFormu">
            <p>
                <label for="kampus">Kampüs</label><br>
                <select id="kampus" name="kampus" required>
                    <option value="">Kampüs seçin</option>
                    <option value="tandogan">Tandoğan</option>
                    <option value="cebeci">Cebeci</option>
                    <option value="golbasi">Gölbaşı</option>
                    <option value="diskapi">Dışkapı</option>
                    <option value="gumusdere">Gümüşdere</option>
                    <option value="kecioren">Keçiören</option>
                    <option value="sihhiye">Sıhhiye (DTCF)</option>
                </select>
            </p>
            <p>
                <label for="ilanNo">İlan no</label><br>
                <input type="number" id="ilanNo" name="ilanNo" min="1" required>
            </p>
            <p>
                <label for="teslimYeri">Eşyayı nereye teslim ettiniz?</label><br>
                <input type="text" id="teslimYeri" name="teslimYeri" placeholder="Örn. Güvenlik görevlisi" required>
            </p>
            <p>
                <label for="aciklama">Açıklama</label><br>
                <textarea id="aciklama" name="aciklama" rows="3" cols="40"></textarea>
            </p>
            <button type="submit">Yanıtı Gönder</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2026 Kampüs Kayıp Eşya Panosu &middot; BLM2537</p>
    </footer>
</body>
</html>
